<svg width="1400" height="1180" viewBox="0 0 1400 1180" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="heroWarm" x1="80" y1="40" x2="1000" y2="160" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFF8F4"/>
      <stop offset="0.52" stop-color="#FFD8B5"/>
      <stop offset="1" stop-color="#FFE8A3"/>
    </linearGradient>
    <linearGradient id="balanceWarm" x1="0" y1="0" x2="342" y2="172" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFD8B5"/>
      <stop offset="1" stop-color="#FFE8A3"/>
    </linearGradient>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="150%" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#4D2815" flood-opacity="0.13"/>
    </filter>
    <filter id="cardShadow" x="-20%" y="-20%" width="140%" height="150%" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#4D2815" flood-opacity="0.07"/>
    </filter>
    <style>
      .bg { fill: #F7EEE8; }
      .phone { fill: #FFF8F4; stroke: #EED9CF; stroke-width: 1; }
      .surface { fill: #FFFFFF; stroke: #F3E1D8; stroke-width: 1; }
      .cream { fill: #FFF8F4; }
      .primary { fill: #E85D04; }
      .primaryText { fill: #E85D04; }
      .redText { fill: #B42318; }
      .yellowText { fill: #F59E0B; }
      .mainText { fill: #201A17; }
      .mutedText { fill: #85736B; }
      .whiteText { fill: #FFFFFF; }
      .small { font: 500 12px Inter, Arial, sans-serif; }
      .caption { font: 400 12px Inter, Arial, sans-serif; }
      .body { font: 400 14px Inter, Arial, sans-serif; }
      .bodyMed { font: 500 14px Inter, Arial, sans-serif; }
      .title { font: 700 22px Inter, Arial, sans-serif; }
      .section { font: 700 17px Inter, Arial, sans-serif; }
      .amount { font: 800 32px Inter, Arial, sans-serif; }
      .label { font: 700 13px Inter, Arial, sans-serif; }
      .nav { font: 600 10px Inter, Arial, sans-serif; }
      .route { font: 600 12px Inter, Arial, sans-serif; }
    </style>
  </defs>

  <rect class="bg" width="1400" height="1180"/>

  <g filter="url(#softShadow)">
    <rect x="80" y="30" width="920" height="120" rx="30" fill="url(#heroWarm)" stroke="#F3E1D8"/>
    <text x="112" y="80" class="mainText" style="font: 800 28px Inter, Arial, sans-serif;">Aries - Budget Management: Person 2 UI / Navigation</text>
    <text x="112" y="112" class="mutedText body">Warm Material 3 finance style for Compose: orange actions, red risk/delete, yellow highlights, cream background, rounded cards, callback-only UI.</text>
  </g>

  <g id="HomeScreen" transform="translate(80 180)" filter="url(#softShadow)">
    <rect class="phone" width="390" height="844" rx="34"/>
    <rect class="cream" x="1" y="1" width="388" height="842" rx="33"/>
    <text x="24" y="50" class="title mainText">Aries</text>
    <text x="24" y="72" class="body mutedText">Quản lý ngân sách</text>

    <g transform="translate(24 106)">
      <rect width="342" height="172" rx="28" fill="url(#balanceWarm)" filter="url(#cardShadow)"/>
      <text x="20" y="34" class="label mainText">Số dư hiện tại</text>
      <text x="20" y="82" class="amount mainText">7.945.000 ₫</text>
      <text x="20" y="128" class="small mainText">Thu nhập</text>
      <text x="20" y="154" class="label primaryText">+8.000.000 ₫</text>
      <text x="190" y="128" class="small mainText">Chi tiêu</text>
      <text x="190" y="154" class="label redText">-55.000 ₫</text>
    </g>

    <g transform="translate(24 292)" filter="url(#cardShadow)">
      <rect class="surface" width="160" height="86" rx="18"/>
      <text x="14" y="28" class="small mutedText">Chi tháng này</text>
      <text x="14" y="60" class="section redText">55.000 ₫</text>
    </g>
    <g transform="translate(206 292)" filter="url(#cardShadow)">
      <rect class="surface" width="160" height="86" rx="18"/>
      <text x="14" y="28" class="small mutedText">Giao dịch</text>
      <text x="14" y="60" class="section primaryText">2</text>
    </g>

    <g transform="translate(24 392)" filter="url(#cardShadow)">
      <rect class="surface" width="342" height="80" rx="18"/>
      <text x="14" y="28" class="small mutedText">Danh mục chi nhiều nhất</text>
      <text x="14" y="60" class="section yellowText">Ăn uống - 55.000 ₫</text>
    </g>

    <text x="24" y="504" class="section mainText">Ngân sách</text>
    <g transform="translate(24 522)" filter="url(#cardShadow)">
      <rect class="surface" width="342" height="98" rx="20"/>
      <text x="16" y="30" class="bodyMed mainText">Ăn uống</text>
      <text x="190" y="30" class="small mutedText">55.000 / 1.500.000 ₫</text>
      <rect x="16" y="58" width="310" height="10" rx="5" fill="#FFE8A3"/>
      <rect x="16" y="58" width="86" height="10" rx="5" fill="#F59E0B"/>
      <text x="16" y="84" class="caption mutedText">Monthly budget progress</text>
    </g>

    <text x="24" y="654" class="section mainText">Giao dịch gần đây</text>
    <text x="290" y="654" class="label primaryText">Xem tất cả</text>
    <g transform="translate(24 674)" filter="url(#cardShadow)">
      <rect class="surface" width="342" height="82" rx="20"/>
      <circle cx="37" cy="41" r="21" fill="#FFD8B5"/>
      <text x="29" y="47" class="label primaryText">↑</text>
      <text x="70" y="34" class="bodyMed mainText">Lương tháng</text>
      <text x="70" y="57" class="caption mutedText">Lương • 2026-05-01</text>
      <text x="226" y="46" class="label primaryText">+8.000.000 ₫</text>
    </g>

    <g transform="translate(0 764)">
      <rect width="390" height="80" fill="#FFFFFF"/>
      <line x1="0" y1="0.5" x2="390" y2="0.5" stroke="#F3E1D8"/>
      <g transform="translate(16 8)">
        <rect x="6" width="76" height="58" rx="18" fill="#FFFFFF"/>
        <rect x="20" y="4" width="48" height="28" rx="14" fill="#FFD8B5"/>
        <text x="36" y="23" class="small mainText">Nhà</text>
        <text x="31" y="49" class="nav primaryText">Home</text>
      </g>
      <text x="121" y="31" class="small mutedText">GD</text>
      <text x="96" y="57" class="nav mutedText">Transactions</text>
      <text x="222" y="31" class="small mutedText">TK</text>
      <text x="202" y="57" class="nav mutedText">Statistics</text>
      <text x="316" y="31" class="small mutedText">CĐ</text>
      <text x="304" y="57" class="nav mutedText">Settings</text>
    </g>
    <circle cx="338" cy="710" r="28" fill="#E85D04" filter="url(#cardShadow)"/>
    <text x="328" y="721" class="whiteText" style="font: 400 32px Inter, Arial, sans-serif;">+</text>
  </g>

  <g id="TransactionListScreen" transform="translate(510 180)" filter="url(#softShadow)">
    <rect class="phone" width="390" height="844" rx="34"/>
    <rect class="cream" x="1" y="1" width="388" height="842" rx="33"/>
    <text x="24" y="54" class="title mainText">Giao dịch</text>

    <g transform="translate(24 96)">
      <rect width="78" height="34" rx="17" fill="#FFD8B5" stroke="#E85D04"/>
      <text x="18" y="22" class="label primaryText">Tất cả</text>
      <rect x="88" width="58" height="34" rx="17" fill="#FFFFFF" stroke="#F1DCD2"/>
      <text x="107" y="22" class="label mutedText">Thu</text>
      <rect x="156" width="56" height="34" rx="17" fill="#FFFFFF" stroke="#F1DCD2"/>
      <text x="176" y="22" class="label mutedText">Chi</text>
    </g>

    <g transform="translate(24 150)" filter="url(#cardShadow)">
      <rect class="surface" width="342" height="110" rx="20"/>
      <circle cx="37" cy="37" r="21" fill="#FFD8B5"/>
      <text x="29" y="43" class="label primaryText">↑</text>
      <text x="70" y="31" class="bodyMed mainText">Lương tháng</text>
      <text x="70" y="54" class="caption mutedText">Lương • 2026-05-01</text>
      <text x="226" y="43" class="label primaryText">+8.000.000 ₫</text>
      <text x="292" y="88" class="label redText">Xóa</text>
    </g>
    <g transform="translate(24 274)" filter="url(#cardShadow)">
      <rect class="surface" width="342" height="110" rx="20"/>
      <circle cx="37" cy="37" r="21" fill="#FFDAD6"/>
      <text x="29" y="43" class="label redText">↓</text>
      <text x="70" y="31" class="bodyMed mainText">Ăn trưa</text>
      <text x="70" y="54" class="caption mutedText">Ăn uống • 2026-05-02</text>
      <text x="238" y="43" class="label redText">-55.000 ₫</text>
      <text x="292" y="88" class="label redText">Xóa</text>
    </g>
    <g transform="translate(24 398)" filter="url(#cardShadow)">
      <rect class="surface" width="342" height="110" rx="20"/>
      <circle cx="37" cy="37" r="21" fill="#FFDAD6"/>
      <text x="29" y="43" class="label redText">↓</text>
      <text x="70" y="31" class="bodyMed mainText">Cà phê nhóm</text>
      <text x="70" y="54" class="caption mutedText">Giải trí • 2026-05-04</text>
      <text x="232" y="43" class="label redText">-120.000 ₫</text>
      <text x="292" y="88" class="label redText">Xóa</text>
    </g>
    <g transform="translate(24 532)" filter="url(#cardShadow)">
      <rect class="surface" width="342" height="108" rx="20"/>
      <text x="98" y="42" class="section mainText">Không có giao dịch</text>
      <text x="50" y="70" class="body mutedText">Thay đổi bộ lọc hoặc thêm giao dịch mới.</text>
    </g>

    <g transform="translate(0 764)">
      <rect width="390" height="80" fill="#FFFFFF"/>
      <line x1="0" y1="0.5" x2="390" y2="0.5" stroke="#F3E1D8"/>
      <text x="51" y="31" class="small mutedText">Nhà</text>
      <text x="47" y="57" class="nav mutedText">Home</text>
      <g transform="translate(93 8)">
        <rect x="0" width="96" height="58" rx="18" fill="#FFFFFF"/>
        <rect x="22" y="4" width="52" height="28" rx="14" fill="#FFD8B5"/>
        <text x="39" y="23" class="small mainText">GD</text>
        <text x="15" y="49" class="nav primaryText">Transactions</text>
      </g>
      <text x="222" y="31" class="small mutedText">TK</text>
      <text x="202" y="57" class="nav mutedText">Statistics</text>
      <text x="316" y="31" class="small mutedText">CĐ</text>
      <text x="304" y="57" class="nav mutedText">Settings</text>
    </g>
    <circle cx="338" cy="710" r="28" fill="#E85D04" filter="url(#cardShadow)"/>
    <text x="328" y="721" class="whiteText" style="font: 400 32px Inter, Arial, sans-serif;">+</text>
  </g>

  <g id="ReusableComponents" transform="translate(940 180)" filter="url(#softShadow)">
    <rect class="surface" width="430" height="844" rx="30"/>
    <text x="24" y="48" class="title mainText">Reusable Compose Components</text>
    <text x="24" y="76" class="body mutedText">Named to match Person 2 scope and current Kotlin files.</text>

    <g transform="translate(24 104)">
      <rect width="342" height="120" rx="24" fill="url(#balanceWarm)"/>
      <text x="18" y="34" class="label mainText">BalanceCard</text>
      <text x="18" y="76" class="title mainText">7.945.000 ₫</text>
      <text x="214" y="76" class="label redText">-55.000 ₫</text>
    </g>

    <g transform="translate(24 248)">
      <rect width="78" height="34" rx="17" fill="#FFD8B5" stroke="#E85D04"/>
      <text x="18" y="22" class="label primaryText">Tất cả</text>
      <rect x="88" width="58" height="34" rx="17" fill="#FFFFFF" stroke="#F1DCD2"/>
      <text x="107" y="22" class="label mutedText">Thu</text>
      <rect x="156" width="56" height="34" rx="17" fill="#FFFFFF" stroke="#F1DCD2"/>
      <text x="176" y="22" class="label mutedText">Chi</text>
      <text x="230" y="22" class="bodyMed mainText">CategoryChip</text>
    </g>

    <g transform="translate(24 310)">
      <rect class="surface" width="342" height="110" rx="20"/>
      <text x="16" y="30" class="bodyMed mainText">TransactionItem</text>
      <text x="16" y="55" class="caption mutedText">Category • yyyy-MM-dd</text>
      <text x="226" y="44" class="label redText">-120.000 ₫</text>
      <text x="292" y="88" class="label redText">Xóa</text>
    </g>

    <g transform="translate(24 448)">
      <rect class="surface" width="342" height="86" rx="20"/>
      <text x="16" y="30" class="bodyMed mainText">AppBottomBar</text>
      <text x="16" y="58" class="caption mutedText">Home • Transactions • Statistics • Settings</text>
    </g>

    <g transform="translate(24 562)">
      <rect width="382" height="220" rx="20" fill="#FFF8F4" stroke="#F3E1D8"/>
      <text x="16" y="32" class="section mainText">Navigation Routes</text>
      <circle cx="22" cy="62" r="4" fill="#E85D04"/><text x="36" y="66" class="route mainText">home</text>
      <circle cx="22" cy="88" r="4" fill="#E85D04"/><text x="36" y="92" class="route mainText">transactions</text>
      <circle cx="22" cy="114" r="4" fill="#F59E0B"/><text x="36" y="118" class="route mainText">add_transaction</text>
      <circle cx="22" cy="140" r="4" fill="#F59E0B"/><text x="36" y="144" class="route mainText">edit_transaction/{transactionId}</text>
      <circle cx="22" cy="166" r="4" fill="#E85D04"/><text x="36" y="170" class="route mainText">statistics</text>
      <circle cx="22" cy="192" r="4" fill="#E85D04"/><text x="36" y="196" class="route mainText">settings / about</text>
    </g>
  </g>

  <g id="ThemeTokens" transform="translate(80 1060)" filter="url(#cardShadow)">
    <rect class="surface" width="860" height="92" rx="24"/>
    <text x="20" y="34" class="section mainText">Aries Theme Tokens</text>
    <g transform="translate(210 20)">
      <rect width="50" height="32" rx="10" fill="#E85D04"/><text x="-4" y="58" class="small mainText">Primary</text>
      <rect x="92" width="50" height="32" rx="10" fill="#FFD8B5"/><text x="64" y="58" class="small mainText">Primary Container</text>
      <rect x="214" width="50" height="32" rx="10" fill="#B42318"/><text x="196" y="58" class="small mainText">Secondary/Error</text>
      <rect x="336" width="50" height="32" rx="10" fill="#F59E0B"/><text x="330" y="58" class="small mainText">Tertiary</text>
      <rect x="442" width="50" height="32" rx="10" fill="#FFF8F4" stroke="#EED9CF"/><text x="426" y="58" class="small mainText">Background</text>
      <rect x="548" width="50" height="32" rx="10" fill="#201A17"/><text x="556" y="58" class="small mainText">Text</text>
    </g>
  </g>
</svg>
